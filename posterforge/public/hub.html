<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>浙里文旅 · 海报与行程</title>
<link rel="icon" href="/favicon.ico" />
<style>
/* ============================================================================
   主界面
   ---------------------------------------------------------------------------
   设计参照 wanderlog.com：纯白底、超大加粗标题、橙色主按钮、大量留白。

   为什么是浅色：这个页面是"入口"，用户第一眼要看清两个功能是什么、
   点哪里进去。深色炫光适合成品展示，不适合当导航页。

   两个入口分别指向：
     · 海报生成  →  /            （PosterForge，本服务）
     · 旅游规划  →  /wenlv/       （main-repair，反代到 8001，同源无跨域）
   ========================================================================== */
:root {
  --brand: #ff5a3c;
  --brand-dark: #e8452a;
  --brand-soft: #fff1ee;
  --ink: #16181d;
  --ink-2: #5c6470;
  --ink-3: #8b929e;
  --line: #e9ebef;
  --bg: #ffffff;
  --bg-soft: #f7f8fa;
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

/* ---------------------------------------------------------------- 顶栏 */
.nav {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-in {
  max-width: 1120px; margin: 0 auto; padding: 0 24px;
  height: 62px; display: flex; align-items: center; gap: 10px;
}
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--brand); }
.logo svg { width: 26px; height: 26px; display: block; }
.logo b { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.nav-sp { flex: 1; }
.nav a.link {
  color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500;
  padding: 8px 12px; border-radius: 9px; transition: 0.15s;
}
.nav a.link:hover { color: var(--ink); background: var(--bg-soft); }
.nav a.pill {
  background: var(--brand); color: #fff; text-decoration: none;
  font-size: 14.5px; font-weight: 700; padding: 9px 18px; border-radius: 999px;
  transition: 0.15s;
}
.nav a.pill:hover { background: var(--brand-dark); }

/* ---------------------------------------------------------------- Hero */
.hero { text-align: center; padding: 78px 24px 10px; }
.hero h1 {
  margin: 0 auto 18px; max-width: 760px;
  font-size: clamp(32px, 5.2vw, 54px); line-height: 1.12;
  font-weight: 800; letter-spacing: -1.2px;
}
.hero p {
  margin: 0 auto 34px; max-width: 560px;
  font-size: 17.5px; line-height: 1.65; color: var(--ink-2);
}
.cta { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 15.5px; font-weight: 700; text-decoration: none;
  padding: 14px 30px; border-radius: 999px; transition: 0.16s; border: 0; cursor: pointer;
  font-family: inherit;
}
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 18px rgba(255, 90, 60, 0.26); }
.btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { color: var(--brand); }
/* 「规划行程」原来是 btn-ghost（纯文字，太弱）。现在和「生成海报」用同一个
   btn-primary —— 两个入口等重，都是红色实心按钮。
   （中途试过深色做层级区分，用户不要，就要红的。） */

/* ---------------------------------------------------------------- 两张功能卡 */
.cards {
  max-width: 1120px; margin: 58px auto 0; padding: 0 24px 84px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
}
.card {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; background: #fff; transition: 0.18s;
}
.card:hover { border-color: #d8dce3; box-shadow: 0 14px 40px rgba(22, 24, 29, 0.09); transform: translateY(-3px); }
.card-prev {
  height: 230px; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.card-body { padding: 20px 22px 22px; }
.card-body h3 { margin: 0 0 7px; font-size: 19px; font-weight: 750; letter-spacing: -0.3px; }
.card-body p { margin: 0 0 14px; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
.card-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.card-tags i {
  font-style: normal; font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--bg-soft); color: var(--ink-2); border: 1px solid var(--line);
}
.card-go {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 6px;
  font-size: 14.5px; font-weight: 700; color: var(--brand);
}

/* 预览：用纯 CSS 画的界面缩略，不引入截图（截图会过期，也和真实界面对不上） */
.mock { position: absolute; inset: 0; background: var(--bg-soft); padding: 18px; }
.mock-a { display: flex; gap: 12px; height: 100%; }
.mock-side { width: 86px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 7px; }
.mock-side i { display: block; height: 9px; border-radius: 4px; background: #e3e6ec; }
.mock-side i:first-child { background: var(--brand); width: 68%; }
.mock-main { flex: 1; display: flex; flex-direction: column; gap: 9px; }
.mock-head { height: 34px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
.mock-field { height: 46px; border-radius: 9px; background: #fff; border: 1px solid var(--line); }
.mock-field.tall { height: 70px; }
.mock-chips { display: flex; gap: 6px; }
.mock-chips i { height: 15px; border-radius: 999px; background: #e9ebef; flex: 1; }
.mock-btn { height: 30px; border-radius: 999px; background: var(--brand); margin-top: auto; width: 76%; }

.mock-b { display: flex; gap: 12px; height: 100%; }
.mock-col { width: 116px; flex: 0 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px; display: flex; flex-direction: column; gap: 8px; }
.mock-col i { display: block; height: 8px; border-radius: 4px; background: #e6e9ee; }
.mock-col i.on { background: var(--brand); width: 62%; }
.mock-tab { height: 22px; border-radius: 6px; background: #eef0f4; }
.mock-plan { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.mock-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
.mock-card i { display: block; height: 8px; border-radius: 4px; background: #e6e9ee; }
.mock-card i:first-child { height: 11px; background: #d9dde4; width: 54%; }
.mock-map { flex: 1; border-radius: 10px; border: 1px solid var(--line); background:
  repeating-linear-gradient(45deg, #eef1f5 0 12px, #e8ecf1 12px 24px); }

@media (max-width: 820px) {
  .cards { grid-template-columns: 1fr; }
  .hero { padding-top: 52px; }
  .nav a.link { display: none; }
}
</style>
</head>
<body>

<!-- ============================================================ 顶栏 -->
<header class="nav">
  <div class="nav-in">
    <a class="logo" href="/hub.html">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2.6"/>
        <circle cx="16" cy="7.5" r="3.4" fill="currentColor"/>
        <circle cx="24.5" cy="16" r="3.4" fill="currentColor"/>
        <circle cx="16" cy="24.5" r="3.4" fill="currentColor"/>
        <circle cx="7.5" cy="16" r="3.4" fill="currentColor"/>
      </svg>
      <b>浙里文旅</b>
    </a>
    <div class="nav-sp"></div>
    <a class="link" href="/">海报生成</a>
    <a class="link" href="/wenlv/">旅游规划</a>
    <!-- 这里原来有个「开始使用」按钮，已删除。
         它跳到 hero 下方的卡片区，而那一段本来就在首屏里 ——
         点了页面几乎不动，用户反馈"这个按键没用"。
         现在导航里两个链接（海报生成 / 旅游规划）就是入口，不需要重复的按钮。 -->
  </div>
</header>

<!-- ============================================================ Hero -->
<section class="hero">
  <h1>一个入口<br />搞定文旅宣传与行程规划</h1>
  <p>给文旅局、酒店、饭馆做宣传物料；给游客做打卡模板，也做可执行的行程。
     两套能力跑在同一台机器上，数据不出本机。</p>
  <div class="cta">
    <a class="btn btn-primary" href="/">生成海报</a>
    <a class="btn btn-primary" href="/wenlv/">规划行程 →</a>
  </div>
</section>

<!-- ============================================================ 两个功能 -->
<section class="cards" id="features">
  <a class="card" href="/">
    <div class="card-prev">
      <div class="mock">
        <div class="mock-a">
          <div class="mock-side"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="mock-main">
            <div class="mock-head"></div>
            <div class="mock-field tall"></div>
            <div class="mock-chips"><i></i><i></i><i></i></div>
            <div class="mock-field"></div>
            <div class="mock-btn"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>海报生成</h3>
      <p>写一句要求或传一张照片，出可发布的海报、打卡卡和多页文案手册。
         41 套版式可套用，AI 底图本机生成，广告法自动把关。</p>
      <div class="card-tags"><i>海报</i><i>打卡卡</i><i>文案手册</i><i>批量出图</i></div>
      <span class="card-go">进入海报生成 →</span>
    </div>
  </a>

  <a class="card" href="/wenlv/">
    <div class="card-prev">
      <div class="mock">
        <div class="mock-b">
          <div class="mock-col">
            <div class="mock-tab"></div>
            <i class="on"></i><i></i><i></i><i></i>
          </div>
          <div class="mock-plan">
            <div class="mock-card"><i></i><i></i><i></i></div>
            <div class="mock-map"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>旅游规划</h3>
      <p>说一句「带 80 岁老人游杭州 3 天，节奏悠闲，预算 5000」，
         出可交互行程：选点、排线、体检、地图与预算一并给出。</p>
      <div class="card-tags"><i>行程规划</i><i>地图</i><i>预算</i><i>规划体检</i></div>
      <span class="card-go">进入旅游规划 →</span>
    </div>
  </a>
</section>

<!-- 悬浮球 AI 助手：与海报页、旅游规划页共用 /ai-ball.js 这一份实现。
     data-api-base 指到反代的 /wenlv/api/（本页在 8800 上，同源 /api/ 是本服务自己的接口）。 -->
<script src="/ai-ball.js" data-api-base="/wenlv" defer></script>



</body>
</html>
